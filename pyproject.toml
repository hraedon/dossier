[project]
name = "dossier-hraedon"
version = "0.1.0"
description = "Lightweight human-facing work-item tracker that is also a provenance instrument, built on regista."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Backend: regista provides durable state, validated transitions, the event
    # log, actors, and signing. Distribution name is `regista-hraedon` on PyPI
    # (import name remains `regista`). For dev, install editable from sibling:
    #   uv pip install -e ../regista
    # Dossier consumes the public trust-log verifier and v6 lifecycle authority
    # APIs introduced in regista 0.7.1. Keep the upper bound inside the 0.x
    # compatibility line; SUITE.lock pins the exact published artifact.
    "regista-hraedon>=0.7.1,<0.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",        # signed session cookies
    "PyNaCl>=1.5",              # Ed25519 keypair generation for per-actor signing
]

[project.optional-dependencies]
auth-ldap = ["ldap3>=2.9"]     # LDAP/AD auth (cert-watch pattern), optional
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",             # test client
    "ruff>=0.16,<1",
    "mypy>=1.10",
    "ldap3>=2.9",              # LDAP/AD auth tests (mocked + integration)
    # CLI contract v1 conformance kit (Plan 018 WI-2 / Plan 019 B1). A published
    # PyPI wheel; consumed only by the conformance tests, never imported by
    # runtime code. v1.1.0 ships the WI-026 meta-guard helpers
    # (assert_cases_declared, ConformanceGateError) that the gate dogfoods at
    # module scope; the local copies cairn carried under 1.0.0 are no longer
    # needed.
    "agent-suite-conformance==1.1.0",
]

[project.scripts]
dossier = "dossier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

# Keep dev-only tooling OUT of the published source distribution.
#
# hatchling's sdist default ships everything not gitignored, so
# dossier_hraedon-0.0.1.tar.gz shipped `githooks/pre-commit` — whose explanatory
# comment named a work-domain identifier. The wheel was unaffected (it packages
# only src/dossier), and PKG-INFO/README were clean, so the identifier was not
# discoverable via PyPI search; but the tarball is immutable and mirrored, which
# makes it the one channel no later fix can retract.
#
# The durable control is not "write better hook comments" — it is refusing to
# publish dev tooling at all. Also excluded: plans/ and reflections/, which are
# narrative dev artifacts and exactly where identifiers have leaked elsewhere in
# this estate.
[tool.hatch.build.targets.sdist]
exclude = [
  "githooks",
  ".github",
  "plans",
  "reflections",
  "samples",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Full-E family selection matching regista/cairn: ruff's standard E (incl.
# E501 line-length, now enforced at 100) + F + I (isort) + N (naming) + W +
# UP (pyupgrade) + RUF. The noisy ruff-0.16 expanded defaults (TRY/BLE/PLW/
# SIM/S) remain deliberately excluded.
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: tests that require a live Postgres (skip if unavailable)",
    "ldap_e2e: tests that require a live LDAP/AD server (skip if unavailable)",
    "slow: tests that build/install wheels or exercise external tools",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
